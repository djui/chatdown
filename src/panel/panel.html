<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chatdown</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <header class="top">
      <div class="title-row">
        <span id="source" class="badge" hidden></span>
        <h1 id="title">Chatdown</h1>
        <button id="refresh" class="icon" title="Reload conversation" aria-label="Reload conversation">↻</button>
      </div>
      <p id="status" class="status"></p>
    </header>

    <section id="empty" class="empty" hidden>
      <p id="empty-text"></p>
    </section>

    <main id="main" hidden>
      <div class="toolbar">
        <div class="seg" role="group" aria-label="Quick select">
          <button data-select="all">All</button>
          <button data-select="none">None</button>
          <button data-select="user">Yours</button>
          <button data-select="assistant" id="select-assistant">Answers</button>
          <button data-select="invert">Invert</button>
        </div>
        <span id="count" class="count"></span>
      </div>
      <p class="hint">Click a message here or its checkbox in the chat to leave it out. Shift-click to pick several at once.</p>
      <ol id="turns" class="turns"></ol>
    </main>

    <footer id="footer" class="bottom" hidden>
      <details id="options" class="options">
        <summary>Options</summary>
        <div class="opts">
          <label title="The model's reasoning, where the site shows it"><input type="checkbox" data-opt="includeThinking" /> Thinking</label>
          <label title="Web searches, code runs and their results"><input type="checkbox" data-opt="includeTools" /> Tool use</label>
          <label title="Thinking and tool use start folded and open with a click"><input type="checkbox" data-opt="collapseDetails" /> Fold extras away</label>
          <label><input type="checkbox" data-opt="includeTimestamps" /> Times and model</label>
          <label title="Title, link and dates at the top, as note properties (YAML front matter)"><input type="checkbox" data-opt="frontMatter" /> Note properties</label>
          <label title="Show a checkbox next to each message in the chat itself"><input type="checkbox" data-opt="markOnPage" /> Checkboxes in the chat</label>
          <label class="row">
            Names
            <select data-opt="headingStyle">
              <option value="heading">As headings</option>
              <option value="bold">In bold</option>
            </select>
          </label>
          <label class="row">Your name <input type="text" data-opt="userLabel" /></label>
          <label class="row">Assistant name <input type="text" data-opt="assistantLabel" id="assistant-label" /></label>
        </div>
      </details>
      <div class="actions">
        <label class="format">
          <span class="sr-only">Format</span>
          <select id="format" aria-label="Export format">
            <option value="markdown">Markdown</option>
            <option value="html">HTML</option>
            <option value="pdf">PDF</option>
            <option value="text">Plain text</option>
            <option value="json">JSON</option>
          </select>
        </label>
        <button id="preview-btn">Preview</button>
        <button id="copy-btn">Copy</button>
        <button id="download-btn" class="primary">Download .md</button>
      </div>
    </footer>

    <dialog id="preview">
      <form method="dialog" class="preview-head">
        <strong id="preview-title">Preview</strong>
        <button value="close" class="icon" aria-label="Close">✕</button>
      </form>
      <textarea id="preview-text" readonly spellcheck="false"></textarea>
      <iframe id="preview-frame" title="Export preview" sandbox hidden></iframe>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="../shared/markdown.js"></script>
    <script src="../shared/md2html.js"></script>
    <script src="../shared/formats.js"></script>
    <script src="panel.js"></script>
  </body>
</html>
